<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Engine Performance Parts - Flashcards</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--dark:#1a1a1a;--teal:#0d7377;--amber:#ffb703;--light:#f5f5f5;--gray:#e0e0e0;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--dark);color:var(--light);font-family:'Source Sans 3',sans-serif;padding:16px}
.wrap{max-width:700px;margin:0 auto}
h1{font-family:Oswald,sans-serif;color:var(--amber);text-align:center;text-transform:uppercase;letter-spacing:2px;font-size:28px;margin-bottom:6px}
.sub{text-align:center;color:var(--gray);font-size:14px;margin-bottom:16px}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--gray);margin-bottom:8px}
.bar{height:8px;background:var(--dark);border:1px solid #ccc;border-radius:4px;overflow:hidden;margin-bottom:16px}
.fill{height:100%;background:var(--amber);transition:width .3s}
.scene{perspective:1000px;cursor:pointer;margin-bottom:16px}
.inner{position:relative;width:100%;aspect-ratio:4/3;transition:transform .6s;transform-style:preserve-3d}
.inner.flip{transform:rotateY(180deg)}
.face{position:absolute;top:0;left:0;width:100%;height:100%;border-radius:8px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:3px solid var(--teal);display:flex;align-items:center;justify-content:center}
.front{background:#f5f5f5}
.front img{max-width:100%;max-height:100%;object-fit:contain}
.back{background:linear-gradient(135deg,var(--teal),#0a5a63);transform:rotateY(180deg);flex-direction:column;text-align:center;padding:20px;color:var(--light)}
.back h2{font-family:Oswald,sans-serif;font-size:24px;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;color:#fff}
.back p{font-size:15px;line-height:1.5;margin-bottom:10px}
.look{color:var(--amber);font-weight:600;font-size:14px}
.ctrl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
button{background:var(--teal);color:var(--light);border:none;padding:10px 18px;border-radius:4px;font-family:'Source Sans 3',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:1px;cursor:pointer;font-size:14px}
button:hover:not(:disabled){background:var(--amber);color:var(--dark)}
button:disabled{opacity:.4;cursor:not-allowed}
button.on{background:var(--amber);color:var(--dark)}
.hint{text-align:center;font-size:13px;color:var(--gray);margin-top:14px}
@media (max-width:480px){h1{font-size:22px}.back h2{font-size:19px}.back p{font-size:13px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Engine Performance Parts</h1>
  <p class="sub">Identify each part. Tap the card to flip.</p>
  <div class="meta"><span id="counter"></span><button id="shuf">Shuffle</button></div>
  <div class="bar"><div class="fill" id="fill"></div></div>
  <div class="scene" id="scene">
    <div class="inner" id="inner">
      <div class="face front"><img id="img" alt="Engine part photo"></div>
      <div class="face back">
        <h2 id="name"></h2>
        <p id="desc"></p>
        <p class="look" id="look"></p>
      </div>
    </div>
  </div>
  <div class="ctrl">
    <button id="prev">Previous</button>
    <button id="next">Next</button>
  </div>
  <p class="hint">Space or tap to flip. Left and right arrows to move.</p>
</div>

let order = cards.map(function(_, i) { return i; });
let idx = 0, flipped = false, shuffled = false;

function show() {
  const c = cards[order[idx]];
  document.getElementById('img').src = c.image;
  document.getElementById('name').textContent = c.name;
  document.getElementById('desc').textContent = c.desc;
  document.getElementById('look').textContent = 'Look for: ' + c.look;
  document.getElementById('counter').textContent = 'Card ' + (idx + 1) + ' of ' + cards.length;
  document.getElementById('fill').style.width = ((idx + 1) / cards.length * 100) + '%';
  document.getElementById('prev').disabled = idx === 0;
  document.getElementById('next').disabled = idx === cards.length - 1;
  flipped = false;
  document.getElementById('inner').classList.remove('flip');
}
function flip() {
  flipped = !flipped;
  document.getElementById('inner').classList.toggle('flip', flipped);
}
function next() { if (idx < cards.length - 1) { idx++; show(); } }
function prev() { if (idx > 0) { idx--; show(); } }
function shuffle() {
  shuffled = !shuffled;
  if (shuffled) {
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = order[i]; order[i] = order[j]; order[j] = t;
    }
  } else {
    order = cards.map(function(_, i) { return i; });
  }
  idx = 0;
  document.getElementById('shuf').classList.toggle('on', shuffled);
  show();
}
document.getElementById('scene').onclick = flip;
document.getElementById('next').onclick = next;
document.getElementById('prev').onclick = prev;
document.getElementById('shuf').onclick = shuffle;
document.addEventListener('keydown', function(e) {
  if (e.code === 'Space') { e.preventDefault(); flip(); }
  else if (e.code === 'ArrowRight') next();
  else if (e.code === 'ArrowLeft') prev();
});
show();
</script>
